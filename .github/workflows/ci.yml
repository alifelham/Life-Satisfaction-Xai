name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Verify, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"

      - name: Verify repository artifacts
        run: python scripts/verify_repository.py

      - name: Verify notebook contract
        run: python scripts/verify_notebook_contract.py

      - name: Lint
        run: ruff check src tests scripts app.py

      - name: Test
        run: pytest -q

      - name: Build package
        run: python -m build
