[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "life-satisfaction-xai"
version = "1.2.0"
description = "Official implementation of life-satisfaction prediction using machine learning and explainable AI"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "MIT"
authors = [{name = "Alif Elham Khan"}]
dependencies = [
  "numpy==1.23.5",
  "pandas==1.5.3",
  "scipy==1.10.1",
  "scikit-learn==1.2.2",
  "imbalanced-learn==0.10.1",
  "matplotlib==3.7.1",
  "seaborn==0.12.2",
  "lightgbm==3.3.5",
  "xgboost==1.7.5",
  "statsmodels==0.13.5",
  "joblib==1.3.2",
  "PyYAML==6.0.1",
]

[project.optional-dependencies]
explain = ["lime==0.2.0.1", "scikit-plot==0.3.7", "missingno==0.5.2"]
dev = ["pytest>=7.4,<9", "ruff>=0.5,<1"]
app = ["gradio>=4,<6"]

[project.scripts]
life-satisfaction-run = "life_satisfaction.pipeline:main"
life-satisfaction-demo = "life_satisfaction.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
